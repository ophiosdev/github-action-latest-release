---
name: Lint Codebase

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  build:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          # Full git history is needed to get a proper list of changed files
          # within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4 # zizmor: ignore[unpinned-uses]
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Ensure package.json version has no tag yet
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists - bump the version in package.json"
            exit 1
          fi
          echo "Version $VERSION has no tag yet"

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v8 # zizmor: ignore[unpinned-uses]
        env:
          DEFAULT_BRANCH: master
          FILTER_REGEX_EXCLUDE: dist/**/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSCPD: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JSON: false
