---
name: Lint Codebase

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          # Full git history is needed to get a proper list of changed files
          # within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47 # zizmor: ignore[unpinned-uses]
        with:
          files: |
            src/**

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Test with coverage
        run: npm test

      - name: Ensure package.json version has no tag yet
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists - bump the version in package.json"
            exit 1
          fi
          echo "Version $VERSION has no tag yet"

      - name: Install tools
        id: install-tools
        uses: jdx/mise-action@v5 # zizmor: ignore[unpinned-uses]

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v8 # zizmor: ignore[unpinned-uses]
        env:
          DEFAULT_BRANCH: master
          FILTER_REGEX_EXCLUDE: dist/**/*
          GITHUB_ACTIONS_CONFIG_FILE: .github/actionlint.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSCPD: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_TRIVY: false
