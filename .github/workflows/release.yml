---
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "package.json"

permissions:
  contents: write
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4 # zizmor: ignore[unpinned-uses]
        with:
          node-version-file: .node-version
          cache: npm

      - name: Package action
        run: |
          # Get github branch without refs
          GITHUB_BRANCH=$( echo "$GITHUB_REF" | sed 's/refs\/heads\///g' )
          echo "GITHUB_BRANCH=$GITHUB_BRANCH" >> "$GITHUB_ENV"

          npm ci
          npm run package

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3 # zizmor: ignore[unpinned-uses]
        with:
          client-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        if: github.ref == 'refs/heads/master'

      - name: Push updated release if available
        uses: test-room-7/action-update-file@v2.1.0 # zizmor: ignore[unpinned-uses]
        with:
          branch: ${{ env.GITHUB_BRANCH }}
          file-path: dist/*
          commit-msg: Update build to latest version
          github-token: ${{ steps.app_token.outputs.token }}
        if: github.ref == 'refs/heads/master'

      - name: Tag version from package.json
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git fetch origin "$GITHUB_BRANCH"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Tagging version $VERSION"
          git tag -f "$TAG" "origin/$GITHUB_BRANCH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push --force origin "$TAG"
        if: github.ref == 'refs/heads/master'
