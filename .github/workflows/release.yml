---
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "package.json"

permissions:
  contents: write
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4 # zizmor: ignore[unpinned-uses]
        with:
          node-version-file: .node-version
          cache: npm

      - name: Package action
        run: |
          # Get github branch without refs
          GITHUB_BRANCH=$( echo "$GITHUB_REF" | sed 's/refs\/heads\///g' )
          echo "GITHUB_BRANCH=$GITHUB_BRANCH" >> "$GITHUB_ENV"

          npm ci
          npm run package

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3 # zizmor: ignore[unpinned-uses]
        with:
          client-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        if: github.ref == 'refs/heads/master'

      - name: Push updated release if available
        uses: test-room-7/action-update-file@v2.1.0 # zizmor: ignore[unpinned-uses]
        with:
          branch: ${{ env.GITHUB_BRANCH }}
          file-path: dist/*
          commit-msg: Update build to latest version
          github-token: ${{ steps.app_token.outputs.token }}
        if: github.ref == 'refs/heads/master'

      - name: Tag and create release
        uses: actions/github-script@v9 # zizmor: ignore[unpinned-uses]
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const tag = `v${version}`;
            const sha = context.sha;
            core.info(`Creating release ${tag} at ${sha}`);

            // Overwrite tag to point at current commit, create it if missing
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
                sha,
                force: true,
              });
            } catch (error) {
              const status = error.status;
              if (status !== 422) {
                throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
            }

            // Remove existing release so it can be recreated
            try {
              await github.rest.repos.deleteReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              core.info(`No existing release for tag ${tag}, skipping delete`);
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });

            core.info(`Release ${tag} created`);
        if: github.ref == 'refs/heads/master'
