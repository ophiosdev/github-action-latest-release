---
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "package.json"

permissions:
  contents: write
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package action
        run: |
          # Get github branch without refs
          GITHUB_BRANCH=$( echo "$GITHUB_REF" | sed 's/refs\/heads\///g' )
          echo "GITHUB_BRANCH=$GITHUB_BRANCH" >> "$GITHUB_ENV"

          npm ci
          npm run package

      - name: Push updated release if available
        uses: test-room-7/action-update-file@v2.1.0 # zizmor: ignore[unpinned-uses]
        with:
          branch: ${{ env.GITHUB_BRANCH }}
          file-path: dist/*
          commit-msg: Update build to latest version
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref == 'refs/heads/master'

      - name: Tag version from package.json
        run: |
          git fetch origin "$GITHUB_BRANCH"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Tagging version $VERSION"
          git tag -f "$TAG" "origin/$GITHUB_BRANCH"
          git push --force origin "$TAG"
        if: github.ref == 'refs/heads/master'
